<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bütçe — Aylık Takip</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --outer:#DCDFEA;
    --app:#F4F5FA;
    --card:#FFFFFF;
    --teal:#16B893;
    --teal-deep:#0E9678;
    --teal-tint:#E4F7F1;
    --ink:#1C2430;
    --ink-soft:#8891A0;
    --ink-faint:#B7BECC;
    --line:#EBEDF3;
    --coral:#F0665A;
    --coral-tint:#FDEBE9;
    --amber:#E8A23A;
    --amber-tint:#FBF1E1;
  }
  *{ font-family:'Plus Jakarta Sans', sans-serif; font-feature-settings:"tnum" 1; }
  html,body{ background:var(--outer); }
  .no-scrollbar::-webkit-scrollbar{ display:none; }
  .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }
  .app-shell{ background:var(--app); box-shadow: 0 30px 60px -20px rgba(20,30,60,0.25); }
  .card{ background:var(--card); border:1px solid var(--line); }
  .hidden-screen{ display:none !important; }
  .pill{ transition: all .18s ease; white-space:nowrap; }
  .nav-btn svg{ width:22px; height:22px; }
  .nav-btn.active{ color:var(--teal); }
  .nav-btn{ color:var(--ink-faint); transition: color .15s ease; }
  input[type="number"], input[type="text"]{ font-family:'Plus Jakarta Sans', sans-serif; }
  input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
  .field{ background:var(--app); border:1px solid var(--line); border-radius:12px; }
  .field:focus-within{ border-color:var(--teal); background:#fff; }
  .field input{ background:transparent; outline:none; }
  .fab{ box-shadow: 0 10px 24px -6px rgba(22,184,147,0.55); }
  .modal-overlay{ background: rgba(20,26,38,0.45); }
  .row-enter{ animation: rowIn .25s ease both; }
  @keyframes rowIn{ from{ opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
  .toast{ transition: opacity .3s ease, transform .3s ease; }
  input:focus-visible, button:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ .row-enter{ animation:none; } }
</style>
</head>
<body class="min-h-screen">

<div class="min-h-screen w-full flex items-start sm:items-center justify-center py-0 sm:py-8 px-0 sm:px-4">
  <div id="appShell" class="app-shell relative w-full sm:max-w-[420px] sm:rounded-[2.25rem] overflow-hidden flex flex-col" style="min-height:100dvh;">

    <!-- TOP BAR -->
    <div class="px-5 pt-6 pb-2 flex items-start justify-between shrink-0">
      <button data-action="openSettings" class="w-10 h-10 rounded-xl bg-white border border-[var(--line)] flex items-center justify-center text-[var(--ink)] shrink-0" aria-label="Ayarlar ve veri yönetimi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M4 7h16M4 12h10M4 17h16"/></svg>
      </button>
      <div class="text-center flex-1 px-2">
        <p id="todayDate" class="text-xs text-[var(--ink-soft)] mb-0.5"></p>
        <p class="font-extrabold text-lg text-[var(--ink)] leading-tight">İyi günler!</p>
      </div>
      <div class="w-10 h-10 rounded-xl bg-[var(--ink)] flex items-center justify-center text-white shrink-0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c1.4-3.6 4.2-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/></svg>
      </div>
    </div>

    <!-- MONTH PILLS -->
    <div id="monthPills" class="flex gap-2 px-5 pb-4 overflow-x-auto no-scrollbar shrink-0"></div>

    <!-- SCREENS -->
    <div class="flex-1 overflow-y-auto px-5 pb-32">
      <div id="screenHome"></div>
      <div id="screenExpenses" class="hidden-screen"></div>
      <div id="screenWealth" class="hidden-screen"></div>
      <div id="screenChart" class="hidden-screen"></div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="absolute bottom-0 inset-x-0 px-6 pb-5 pt-3 bg-white rounded-t-[1.75rem] border-t border-[var(--line)] flex items-center justify-between">
      <button data-tab="home" class="nav-btn flex flex-col items-center gap-1 py-1 px-2" aria-label="Ana sayfa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9.5a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-9"/></svg>
      </button>
      <button data-tab="expenses" class="nav-btn flex flex-col items-center gap-1 py-1 px-2" aria-label="Giderler">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
      </button>
      <button data-action="openAddExtra" class="fab -mt-9 w-14 h-14 rounded-full flex items-center justify-center text-white shrink-0" style="background:var(--teal);" aria-label="Ekstra masraf ekle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button data-tab="wealth" class="nav-btn flex flex-col items-center gap-1 py-1 px-2" aria-label="Varlık">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v3"/><path d="M3 7v10a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-4"/><path d="M17 12h3a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-3a2 2 0 0 1 0-4Z"/></svg>
      </button>
      <button data-tab="chart" class="nav-btn flex flex-col items-center gap-1 py-1 px-2" aria-label="Aylık grafik">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg>
      </button>
    </div>

  </div>
</div>

<!-- MODAL: ADD EXTRA -->
<div id="modalAddExtra" class="fixed inset-0 modal-overlay hidden-screen items-end sm:items-center justify-center z-50 flex">
  <div class="w-full sm:max-w-[380px] bg-white rounded-t-3xl sm:rounded-3xl p-6">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-extrabold text-lg text-[var(--ink)]">Ekstra Masraf Ekle</h3>
      <button data-action="closeModal" data-modal="modalAddExtra" class="w-8 h-8 rounded-full bg-[var(--app)] flex items-center justify-center text-[var(--ink-soft)]">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
      </button>
    </div>
    <p class="text-xs text-[var(--ink-soft)] mb-4">Bu masraf <span id="addExtraMonthLabel" class="font-semibold text-[var(--ink)]"></span> ayına eklenecek.</p>
    <label class="text-xs font-medium text-[var(--ink-soft)] mb-1 block">Açıklama</label>
    <div class="field px-3 py-2.5 mb-3">
      <input type="text" id="quickExtraName" placeholder="Örn. Araç bakımı" class="w-full text-sm text-[var(--ink)]">
    </div>
    <label class="text-xs font-medium text-[var(--ink-soft)] mb-1 block">Tutar</label>
    <div class="field px-3 py-2.5 mb-5 flex items-center gap-1">
      <span class="text-[var(--ink-soft)] text-sm">€</span>
      <input type="number" id="quickExtraAmount" step="0.01" min="0" placeholder="0" class="w-full text-sm text-[var(--ink)]">
    </div>
    <button data-action="submitAddExtra" class="w-full py-3 rounded-xl text-white font-semibold text-sm" style="background:var(--teal);">Ekle</button>
  </div>
</div>

<!-- MODAL: SETTINGS -->
<div id="modalSettings" class="fixed inset-0 modal-overlay hidden-screen items-end sm:items-center justify-center z-50 flex">
  <div class="w-full sm:max-w-[380px] bg-white rounded-t-3xl sm:rounded-3xl p-6">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-extrabold text-lg text-[var(--ink)]">Veri Yönetimi</h3>
      <button data-action="closeModal" data-modal="modalSettings" class="w-8 h-8 rounded-full bg-[var(--app)] flex items-center justify-center text-[var(--ink-soft)]">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
      </button>
    </div>
    <p class="text-sm text-[var(--ink-soft)] mb-5">Tüm veriler yalnızca bu tarayıcıda (localStorage) saklanır, hiçbir sunucuya gönderilmez.</p>
    <button data-action="loadSample" class="w-full py-3 rounded-xl border border-[var(--teal)] text-[var(--teal-deep)] font-semibold text-sm mb-3">Örnek Verilerle Doldur</button>
    <button data-action="resetAll" class="w-full py-3 rounded-xl border border-[var(--coral)] text-[var(--coral)] font-semibold text-sm">Tüm Verileri Sıfırla</button>
  </div>
</div>

<div id="toast" class="toast fixed bottom-6 left-1/2 -translate-x-1/2 opacity-0 pointer-events-none translate-y-2 bg-[var(--ink)] text-white text-xs px-4 py-2.5 rounded-full shadow-lg z-[60]">
  Kaydedildi
</div>

<script>
(function(){
"use strict";

const STORAGE_KEY = "butce-defteri-v3";
const MONTHS_TR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const MONTHS_TR_SHORT = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];

const FIXED_LABELS = { kira:"Kira", vodafone:"Vodafone", dogalgazElektrik:"Doğalgaz ve Elektrik", su:"Su", krediKarti:"Türkiye Kredi Kartı" };

const ICON = {
  income:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  fixed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>',
  extra:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 12 22l-9-9V4a1 1 0 0 1 1-1h9l7.59 7.59a2 2 0 0 1 0 2.82Z"/><circle cx="7.5" cy="7.5" r="1.1" fill="currentColor" stroke="none"/></svg>',
  pool:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="7" cy="14.5" r="1" fill="currentColor" stroke="none"/></svg>',
  allowance:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M2 20c0-3.3 3.1-6 7-6s7 2.7 7 6"/><circle cx="17.5" cy="8.5" r="2.3"/><path d="M15.3 6.3c1.1-.5 2.5-.5 3.6 0"/></svg>',
  savings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="14" height="12" rx="2"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/><path d="M9 13.5h6"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>',
  arrowUp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M9 7h8v8"/></svg>',
  arrowDown:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10"/><path d="M17 7v8H9"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  chevronDown:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>'
};

function emptyMonth(){
  return {
    incomes:{ esi1:0, esi2:0, ekstra:0 },
    fixedExpenses:{ kira:0, vodafone:0, dogalgazElektrik:0, su:0, krediKarti:0 },
    extras:[],
    pool:1000,
    birikim:0,
    allowance:{ esi1:0, esi2:0 },
    berkLimit:0,
    balanceOverride:null
  };
}

const DEFAULT_STATE = {
  baseline:0,
  currentMonth:"2026-08",
  months:{ "2026-08": emptyMonth() }
};

const SAMPLE_STATE = {
  baseline:28000,
  currentMonth:"2026-08",
  months:{
    "2026-07":{
      incomes:{esi1:2450, esi2:2100, ekstra:0},
      fixedExpenses:{kira:1250, vodafone:45, dogalgazElektrik:110, su:25, krediKarti:180},
      extras:[{id:"s1", name:"Yıllık sigorta", amount:440}],
      pool:1000, birikim:0, allowance:{esi1:250, esi2:250}, berkLimit:600, balanceOverride:null
    },
    "2026-08":{
      incomes:{esi1:2450, esi2:2100, ekstra:0},
      fixedExpenses:{kira:1250, vodafone:45, dogalgazElektrik:95, su:30, krediKarti:180},
      extras:[{id:"s2", name:"Tatil harcaması", amount:450}],
      pool:1000, birikim:300, allowance:{esi1:250, esi2:250}, berkLimit:450, balanceOverride:null
    }
  }
};

let state = loadState();
let activeTab = "home";
let openRows = new Set();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return structuredClone(DEFAULT_STATE);
    const p = JSON.parse(raw);
    const months = {};
    Object.keys(p.months||{}).forEach(k=>{
      const m = p.months[k]||{};
      months[k] = {
        incomes:{ esi1:0, esi2:0, ekstra:0, ...(m.incomes||{}) },
        fixedExpenses:{ kira:0, vodafone:0, dogalgazElektrik:0, su:0, krediKarti:0, ...(m.fixedExpenses||{}) },
        extras: Array.isArray(m.extras)? m.extras.map(x=>({id:x.id||uid(), name:x.name||"", amount:Number(x.amount)||0})) : [],
        pool: typeof m.pool==="number"? m.pool : 1000,
        birikim: typeof m.birikim==="number"? m.birikim : 0,
        allowance:{ esi1:0, esi2:0, ...(m.allowance||{}) },
        berkLimit: typeof m.berkLimit==="number" ? m.berkLimit : 0,
        balanceOverride: typeof m.balanceOverride==="number" ? m.balanceOverride : null
      };
    });
    if(Object.keys(months).length===0) months[DEFAULT_STATE.currentMonth] = emptyMonth();
    const sortedKeys = Object.keys(months).sort();
    return {
      baseline: typeof p.baseline==="number" ? p.baseline : 0,
      currentMonth: months[p.currentMonth] ? p.currentMonth : sortedKeys[sortedKeys.length-1],
      months
    };
  }catch(e){
    console.warn("Kayıtlı veri okunamadı, varsayılana dönülüyor.", e);
    return structuredClone(DEFAULT_STATE);
  }
}

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  showToast();
}

function uid(){ return 'x' + Math.random().toString(36).slice(2,9); }

function fmt(n){
  const val = Number.isFinite(n) ? n : 0;
  return val.toLocaleString('de-DE', { style:'currency', currency:'EUR' });
}

function monthLabel(key){ const [y,m] = key.split('-').map(Number); return `${MONTHS_TR[m-1]} ${y}`; }
function monthShort(key){ const [y,m] = key.split('-').map(Number); return `${MONTHS_TR_SHORT[m-1]} '${String(y).slice(2)}`; }
function nextMonthKey(key){ let [y,m] = key.split('-').map(Number); m += 1; if(m>12){ m=1; y+=1; } return `${y}-${String(m).padStart(2,'0')}`; }
function sortedMonthKeys(){ return Object.keys(state.months).sort(); }
function cm(){ return state.months[state.currentMonth]; }

function monthTotals(m){
  const totalIncome = m.incomes.esi1 + m.incomes.esi2 + (m.incomes.ekstra||0);
  const totalFixed = Object.values(m.fixedExpenses).reduce((a,b)=>a+b,0);
  const totalExtras = m.extras.reduce((a,e)=>a+(Number(e.amount)||0),0);
  const totalPoolAllowance = m.pool + m.allowance.esi1 + m.allowance.esi2;
  const totalAllowance = m.allowance.esi1 + m.allowance.esi2;
  const birikim = m.birikim || 0;
  // "Kalan" (harcanabilir bakiye) hesabında Birikim bir gider gibi düşülür.
  const totalOut = totalFixed + totalExtras + totalPoolAllowance + birikim;
  const net = totalIncome - totalOut;
  // Toplam varlık hesabında Birikim nötrdür: harcanmış değil, sadece varlığa aktarılmıştır.
  const wealthNet = totalIncome - totalFixed - totalExtras - totalPoolAllowance;
  const pct = totalIncome>0 ? Math.min(100, Math.max(0,(totalOut/totalIncome)*100)) : 0;
  return { totalIncome, totalFixed, totalExtras, totalPoolAllowance, totalAllowance, birikim, totalOut, net, wealthNet, pct };
}

function wealthHistory(){
  let running = state.baseline || 0;
  const rows = [];
  sortedMonthKeys().forEach(key=>{
    const m = state.months[key];
    const t = monthTotals(m);
    const start = running;
    const computedEnd = start + t.wealthNet;
    const overridden = typeof m.balanceOverride === 'number';
    const end = overridden ? m.balanceOverride : computedEnd;
    running = end;
    rows.push({ key, start, net:t.wealthNet, end, computedEnd, overridden });
  });
  return rows;
}

function detailLine(label, val){
  return `<div class="flex items-center justify-between py-1"><span class="text-xs text-[var(--ink-soft)]">${label}</span><span class="text-xs font-semibold text-[var(--ink)]">${fmt(val)}</span></div>`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- STRUCTURAL RENDER ---------- */

function ensureMonth(){
  if(!state.months[state.currentMonth]) state.currentMonth = sortedMonthKeys()[sortedMonthKeys().length-1];
}

function buildMonthPills(){
  ensureMonth();
  const wrap = document.getElementById('monthPills');
  const keys = sortedMonthKeys();
  wrap.innerHTML = keys.map(k=>{
    const active = k===state.currentMonth;
    return `<button data-action="selectMonth" data-key="${k}" class="pill row-enter px-4 py-2 rounded-full text-xs font-semibold ${active ? 'text-white' : 'text-[var(--ink-soft)] bg-white border border-[var(--line)]'}" ${active ? `style="background:var(--teal);"` : ''}>${monthShort(k)}</button>`;
  }).join('') + `<button data-action="addMonth" class="pill row-enter w-9 h-9 rounded-full bg-white border border-dashed border-[var(--ink-faint)] flex items-center justify-center text-[var(--ink-soft)] shrink-0" aria-label="Yeni ay ekle">${ICON.plus}</button>`;
}

function buildExpensesScreen(){
  ensureMonth();
  const m = cm();
  const el = document.getElementById('screenExpenses');
  el.innerHTML = `
    <div class="pt-2 pb-1">
      <h2 class="font-extrabold text-xl text-[var(--ink)]">Giderler</h2>
      <p class="text-xs text-[var(--ink-soft)]">${monthLabel(state.currentMonth)} verileri</p>
    </div>

    <div class="card rounded-2xl p-4 mt-4">
      <h3 class="font-bold text-sm text-[var(--ink)] mb-3">Gelirler</h3>
      <div class="space-y-2.5">
        <div class="flex items-center justify-between gap-3">
          <label class="text-sm text-[var(--ink-soft)]">Tracy — Maaş (BBVA)</label>
          <div class="field flex items-center gap-1 px-3 py-2 w-32">
            <span class="text-[var(--ink-soft)] text-xs">€</span>
            <input type="number" step="0.01" min="0" data-role="income" data-key="esi1" value="${m.incomes.esi1}" class="w-full text-right text-sm text-[var(--ink)]">
          </div>
        </div>
        <div class="flex items-center justify-between gap-3">
          <label class="text-sm text-[var(--ink-soft)]">Berk — Maaş (BBVA)</label>
          <div class="field flex items-center gap-1 px-3 py-2 w-32">
            <span class="text-[var(--ink-soft)] text-xs">€</span>
            <input type="number" step="0.01" min="0" data-role="income" data-key="esi2" value="${m.incomes.esi2}" class="w-full text-right text-sm text-[var(--ink)]">
          </div>
        </div>
        <div class="flex items-center justify-between gap-3 pt-2.5 mt-1 border-t border-[var(--line)]">
          <div>
            <label class="text-sm text-[var(--ink-soft)] block">Ekstra Gelir</label>

function buildWealthScreen(){
  ensureMonth();
  const el = document.getElementById('screenWealth');
  const earliest = sortedMonthKeys()[0];
  const history = wealthHistory();
  const currentRow = history.find(h=>h.key===state.currentMonth) || {end:0, net:0};
  const overridden = typeof cm().balanceOverride === 'number';
  el.innerHTML = `
    <div class="pt-2 pb-1">
      <h2 class="font-extrabold text-xl text-[var(--ink)]">Varlık</h2>
      <p class="text-xs text-[var(--ink-soft)]">Aylık birikim geçmişiniz</p>
    </div>

    <div class="card rounded-2xl p-4 mt-4">
      <label class="text-xs font-semibold text-[var(--ink-soft)] block mb-1">Başlangıç Varlığı</label>
      <p class="text-[10px] text-[var(--ink-faint)] mb-2">${earliest ? monthLabel(earliest) : ''} ayı başlamadan önceki toplam varlığınız</p>
      <div class="field flex items-center gap-1 px-3 py-2.5">
        <span class="text-[var(--ink-soft)] text-sm">€</span>
        <input type="number" step="0.01" data-role="baseline" value="${state.baseline}" class="w-full text-sm text-[var(--ink)]">
      </div>
    </div>

    <div class="rounded-2xl p-5 mt-4 text-white" style="background:linear-gradient(135deg, var(--teal), var(--teal-deep));">
      <div class="flex items-center justify-between mb-1">
        <p class="text-xs opacity-90">${monthLabel(state.currentMonth)} Sonu Toplam Varlık</p>
        <span class="w-4 h-4 opacity-80 inline-flex">${ICON.pencil}</span>
      </div>
      <div class="flex items-center gap-1">
        <span class="font-extrabold text-3xl opacity-90">€</span>
        <input type="number" step="0.01" data-role="balanceOverride" value="${currentRow.end}" class="bg-transparent font-extrabold text-3xl outline-none w-full placeholder-white/60" placeholder="0">

      <button data-action="resetBalanceOverride" id="btnResetOverride" class="block text-[11px] underline mt-2 opacity-90 ${overridden?'':'hidden'}">Otomatik hesaplanan değere dön</button>

    <div class="mt-5 mb-4">
      <h3 class="font-bold text-sm text-[var(--ink)] mb-3">Aylık Geçmiş</h3>
      <div id="wealthHistoryList" class="space-y-2.5"></div>

  `;
}

function buildChartScreen(){
  const el = document.getElementById('screenChart');
  const keys = sortedMonthKeys();
  const data = keys.map(k=>{
    const t = monthTotals(state.months[k]);
    return { key:k, income:t.totalIncome, expense:t.totalOut, net:t.net };
  });
  const maxVal = Math.max(1, ...data.map(d=>Math.max(d.income, d.expense)));

  el.innerHTML = `
    <div class="pt-2 pb-1">
      <h2 class="font-extrabold text-xl text-[var(--ink)]">Grafik</h2>
      <p class="text-xs text-[var(--ink-soft)]">Aylık gelir - gider karşılaştırması</p>
    </div>

    <div class="flex items-center gap-4 mt-4 mb-2">
      <span class="flex items-center gap-1.5 text-xs text-[var(--ink-soft)]"><span class="w-2.5 h-2.5 rounded-full" style="background:var(--teal);"></span>Gelir</span>
      <span class="flex items-center gap-1.5 text-xs text-[var(--ink-soft)]"><span class="w-2.5 h-2.5 rounded-full" style="background:var(--coral);"></span>Gider</span>
    </div>

    <div class="card rounded-2xl p-4">
      <div class="flex items-end gap-4 h-48 overflow-x-auto no-scrollbar pb-1">
        ${data.length===0 ? `<p class="text-xs text-[var(--ink-faint)] italic">Henüz veri yok.</p>` : data.map(d=>`
          <div class="flex flex-col items-center gap-1.5 shrink-0" style="min-width:44px;">
            <div class="flex items-end gap-1 h-40">
              <div class="w-3.5 rounded-full" style="height:${Math.max(4,(d.income/maxVal)*100)}%; background:var(--teal);" title="Gelir: ${fmt(d.income)}"></div>
              <div class="w-3.5 rounded-full" style="height:${Math.max(4,(d.expense/maxVal)*100)}%; background:var(--coral);" title="Gider: ${fmt(d.expense)}"></div>
            </div>
            <span class="text-[10px] text-[var(--ink-soft)] font-medium">${monthShort(d.key)}</span>
          </div>`).join('')}
      </div>
    </div>

    <div class="mt-4 mb-4 space-y-2">
      ${[...data].reverse().map(d=>`
        <div class="card rounded-xl p-3 flex items-center justify-between">
          <span class="text-sm font-semibold text-[var(--ink)]">${monthLabel(d.key)}</span>
          <span class="text-right">
            <span class="block text-[11px] font-semibold" style="color:var(--teal-deep);">Gelir ${fmt(d.income)}</span>
            <span class="block text-[11px] font-semibold" style="color:var(--coral);">Gider ${fmt(d.expense)}</span>
          </span>
        </div>`).join('')}
    </div>
  `;
}

function renderStructure(){
  buildMonthPills();
  buildExpensesScreen();
  buildWealthScreen();
  renderComputed();
  applyActiveTab();
}

/* ---------- COMPUTED / DISPLAY-ONLY RENDER ---------- */

function renderComputed(){
  const m = cm();
  const t = monthTotals(m);
  const history = wealthHistory();
  const currentRow = history.find(h=>h.key===state.currentMonth);

  const totFixedEl = document.getElementById('expTotalFixed');
  if(totFixedEl) totFixedEl.textContent = fmt(t.totalFixed);
  const totExtrasEl = document.getElementById('expTotalExtras');
  if(totExtrasEl) totExtrasEl.textContent = fmt(t.totalExtras);
  const totPoolEl = document.getElementById('expTotalPool');
  if(totPoolEl) totPoolEl.textContent = fmt(t.totalPoolAllowance);

  const balInput = document.querySelector('#screenWealth [data-role="balanceOverride"]');
  if(balInput && currentRow && document.activeElement !== balInput){
    balInput.value = currentRow.end;
  }
  const resetBtn = document.getElementById('btnResetOverride');
  if(resetBtn){
    const overridden = typeof m.balanceOverride === 'number';
    resetBtn.classList.toggle('hidden', !overridden);
  }
  const deltaEl = document.getElementById('wealthDelta');
  if(deltaEl && currentRow){
    const up = currentRow.net >= 0;
    deltaEl.innerHTML = `<span class="w-3 h-3 inline-flex">${up?ICON.arrowUp:ICON.arrowDown}</span> ${up?'+':''}${fmt(currentRow.net)} bu ay`;
  }

  const histWrap = document.getElementById('wealthHistoryList');
  if(histWrap){
    const rowsDesc = [...history].reverse();
    histWrap.innerHTML = rowsDesc.map(h=>{
      const up = h.net>=0;
      const active = h.key===state.currentMonth;
      return `
        <button data-action="selectMonth" data-key="${h.key}" class="w-full text-left card rounded-xl p-3.5 flex items-center gap-3 ${active ? 'ring-2' : ''}" style="${active?'--tw-ring-color:var(--teal);':''}">
          <span class="w-1.5 self-stretch rounded-full shrink-0" style="background:${up?'var(--teal)':'var(--coral)'};"></span>
          <span class="flex-1 min-w-0">
            <span class="flex items-center gap-1.5 flex-wrap">
              <span class="block text-sm font-semibold text-[var(--ink)]">${monthLabel(h.key)}</span>
              ${h.overridden ? `<span class="text-[9px] px-1.5 py-0.5 rounded-full" style="background:var(--amber-tint); color:var(--amber);">Düzenlendi</span>` : ''}
            </span>
            <span class="block text-[11px] ${up?'text-[var(--teal-deep)]':'text-[var(--coral)]'}">${up?'+':''}${fmt(h.net)}</span>
          </span>
          <span class="text-sm font-bold text-[var(--ink)] shrink-0">${fmt(h.end)}</span>
        </button>`;
    }).join('');
  }

  buildChartScreen();
  renderHomeScreen(t, currentRow);
}

function refreshHome(){
  const t = monthTotals(cm());
  const history = wealthHistory();
  const currentRow = history.find(h=>h.key===state.currentMonth);
  renderHomeScreen(t, currentRow);
}

function accordionRow(key, icon, bg, fg, title, subtitle, amount, negative, detailHtml){
  const open = openRows.has(key);
  return `
    <div class="card rounded-xl overflow-hidden">
      <button data-action="toggleAccordion" data-key="${key}" class="w-full p-3 flex items-center gap-3 text-left">
        <span class="w-10 h-10 rounded-full flex items-center justify-center shrink-0" style="background:${bg}; color:${fg};"><span class="w-5 h-5 inline-flex">${icon}</span></span>
        <span class="flex-1 min-w-0">
          <span class="block text-sm font-semibold text-[var(--ink)]">${title}</span>
          <span class="block text-[11px] text-[var(--ink-faint)]">${subtitle}</span>
        </span>
        <span class="text-sm font-bold shrink-0" style="color:${negative?'var(--ink)':'var(--teal-deep)'};">${negative?'−':''}${fmt(amount)}</span>
        <span class="w-4 h-4 shrink-0 text-[var(--ink-faint)] transition-transform inline-flex ${open?'rotate-180':''}">${ICON.chevronDown}</span>
      </button>
      <div class="${open?'':'hidden'} px-3 pb-3 pt-1 border-t border-[var(--line)]">
        ${detailHtml}
      </div>
    </div>`;
}

function renderHomeScreen(t, currentRow){
  const m = cm();
  const el = document.getElementById('screenHome');
  const pctLabel = Math.round(t.pct);
  const circumference = 2*Math.PI*52;
  const offset = circumference * (1 - t.pct/100);

  const incomeDetail = detailLine('Tracy Maaş', m.incomes.esi1) + detailLine('Berk Maaş', m.incomes.esi2) + detailLine('Ekstra Gelir', m.incomes.ekstra||0);
  const fixedDetail = Object.keys(FIXED_LABELS).map(k=>detailLine(FIXED_LABELS[k], m.fixedExpenses[k])).join('');
  const extrasDetail = m.extras.length===0
    ? `<p class="text-xs text-[var(--ink-faint)] italic py-1">Bu ay için ekstra masraf eklenmedi.</p>`
    : m.extras.map(ex=>detailLine(ex.name||'Ekstra', ex.amount)).join('');
  const poolDetail = detailLine('Ortak Hesap', m.pool) + `<p class="text-[10px] text-[var(--ink-faint)] leading-snug pt-1">Ortak hesap birikim hesabınız olduğundan bu tutar toplam varlığınızdan düşülür.</p>`;
  const birikimDetail = detailLine('Birikim', m.birikim) + `<p class="text-[10px] text-[var(--ink-faint)] leading-snug pt-1">Bu tutar gider gibi görünür, ancak toplam varlığınızdan düşülmez — o ay için varlığınıza eklenmiş sayılır.</p>`;
  const allowanceDetail = detailLine('Tracy Harçlık', m.allowance.esi1) + detailLine('Berk Harçlık', m.allowance.esi2) + `<div class="flex items-center justify-between py-1"><span class="text-xs text-[var(--ink-soft)]">Berk Limit (not)</span><span class="text-xs font-semibold text-[var(--ink)]">${fmt(m.berkLimit||0)}</span></div>`;

  el.innerHTML = `
    <div class="rounded-2xl p-5 mt-2 text-white relative overflow-hidden" style="background:linear-gradient(135deg, var(--teal), var(--teal-deep));">
      <p class="text-xs opacity-90">Bu Ayki Bütçe</p>
      <p class="font-extrabold text-lg mb-4">${monthLabel(state.currentMonth)}</p>
      <div class="flex items-center gap-4">
        <div class="relative w-28 h-28 shrink-0">
          <svg viewBox="0 0 120 120" class="w-28 h-28 -rotate-90">
            <circle cx="60" cy="60" r="52" stroke="rgba(255,255,255,0.28)" stroke-width="10" fill="none"/>
            <circle cx="60" cy="60" r="52" stroke="#ffffff" stroke-width="10" fill="none" stroke-linecap="round"
              stroke-dasharray="${circumference.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"/>
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span class="font-extrabold text-xl">%${pctLabel}</span>
            <span class="text-[9px] opacity-90">kullanıldı</span>
          </div>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-[11px] opacity-80">Harcanan</p>
          <p class="font-bold text-sm mb-2">${fmt(t.totalOut)}</p>
          <p class="text-[11px] opacity-80">Kalan</p>
          <p class="font-bold text-sm">${fmt(t.net)}</p>
        </div>
      </div>
    </div>

    <div class="mt-5">
      <h3 class="font-bold text-sm text-[var(--ink)] mb-3">Bu Ay Özeti <span class="text-[10px] font-normal text-[var(--ink-faint)]">— detay için başlığa dokun</span></h3>
      <div class="space-y-2">
        ${accordionRow('income', ICON.income, 'var(--teal-tint)', 'var(--teal-deep)', 'Gelir', 'Tracy + Berk + Ekstra', t.totalIncome, false, incomeDetail)}
        ${accordionRow('fixed', ICON.fixed, 'var(--amber-tint)', 'var(--amber)', 'Sabit Masraflar', Object.keys(FIXED_LABELS).length + ' kalem', t.totalFixed, true, fixedDetail)}
        ${accordionRow('extras', ICON.extra, 'var(--coral-tint)', 'var(--coral)', 'Ekstralar', m.extras.length + ' kalem', t.totalExtras, true, extrasDetail)}
        ${accordionRow('birikim', ICON.savings, 'var(--teal-tint)', 'var(--teal-deep)', 'Birikim', 'Toplam varlığa eklenir', m.birikim, true, birikimDetail)}
        ${accordionRow('pool', ICON.pool, 'var(--coral-tint)', 'var(--coral)', 'Ortak Hesap', 'Toplam varlıktan düşülür', m.pool, true, poolDetail)}
        ${accordionRow('allowance', ICON.allowance, 'var(--teal-tint)', 'var(--teal-deep)', 'Harçlıklar', 'Tracy + Berk', t.totalAllowance, true, allowanceDetail)}
      </div>
    </div>

    <button data-tab="wealth" class="w-full card rounded-2xl p-4 mt-5 mb-4 flex items-center justify-between text-left">
      <span>
        <span class="block text-xs text-[var(--ink-soft)]">Ay Sonu Toplam Varlık</span>
        <span class="block font-extrabold text-xl text-[var(--ink)]">${currentRow ? fmt(currentRow.end) : fmt(0)}</span>
      </span>
      <span class="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style="background:var(--teal-tint); color:var(--teal-deep);">
        <span class="w-4 h-4 inline-flex">${ICON.arrowUp}</span>
      </span>
    </button>
  `;
}

/* ---------- TABS / MODALS ---------- */

function applyActiveTab(){
  document.getElementById('screenHome').classList.toggle('hidden-screen', activeTab!=='home');
  document.getElementById('screenExpenses').classList.toggle('hidden-screen', activeTab!=='expenses');
  document.getElementById('screenWealth').classList.toggle('hidden-screen', activeTab!=='wealth');
  document.getElementById('screenChart').classList.toggle('hidden-screen', activeTab!=='chart');
  document.querySelectorAll('.nav-btn[data-tab]').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.tab===activeTab);
  });
  const scroller = document.querySelector('.flex-1.overflow-y-auto');
  if(scroller) scroller.scrollTop = 0;
}

function openModal(id){
  const modal = document.getElementById(id);
  modal.classList.remove('hidden-screen');
  modal.classList.add('flex');
  if(id==='modalAddExtra'){
    document.getElementById('addExtraMonthLabel').textContent = monthLabel(state.currentMonth);
    document.getElementById('quickExtraName').value = '';
    document.getElementById('quickExtraAmount').value = '';
    setTimeout(()=>document.getElementById('quickExtraName').focus(), 50);
  }
}
function closeModal(id){
  const modal = document.getElementById(id);
  modal.classList.add('hidden-screen');
  modal.classList.remove('flex');
}

let toastTimer = null;
function showToast(){
  const toast = document.getElementById('toast');
  toast.classList.remove('opacity-0','translate-y-2');
  toast.classList.add('opacity-100','translate-y-0');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{
    toast.classList.add('opacity-0','translate-y-2');
    toast.classList.remove('opacity-100','translate-y-0');
  }, 1100);
}

/* ---------- EVENT DELEGATION ---------- */

document.addEventListener('input', function(e){
  const t = e.target;
  const role = t.dataset.role;
  if(!role) return;
  if(role==='baseline'){
    state.baseline = parseFloat(t.value) || 0;
  } else {
    const m = cm();
    switch(role){
      case 'income': m.incomes[t.dataset.key] = parseFloat(t.value)||0; break;
      case 'fixed': m.fixedExpenses[t.dataset.key] = parseFloat(t.value)||0; break;
      case 'pool': m.pool = parseFloat(t.value)||0; break;
      case 'birikim': m.birikim = parseFloat(t.value)||0; break;
      case 'allowance': m.allowance[t.dataset.key] = parseFloat(t.value)||0; break;
      case 'berkLimit': m.berkLimit = parseFloat(t.value)||0; break;
      case 'extraName': { const ex = m.extras.find(x=>x.id===t.dataset.id); if(ex) ex.name = t.value; break; }
      case 'extraAmount': { const ex = m.extras.find(x=>x.id===t.dataset.id); if(ex) ex.amount = parseFloat(t.value)||0; break; }
      case 'balanceOverride': m.balanceOverride = t.value===''? null : (parseFloat(t.value)||0); break;
    }
  }
  saveState();
  renderComputed();
});

document.addEventListener('click', function(e){
  const tabBtn = e.target.closest('[data-tab]');
  if(tabBtn){
    activeTab = tabBtn.dataset.tab;
    applyActiveTab();
    return;
  }

  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;

  if(action==='selectMonth'){
    state.currentMonth = btn.dataset.key;
    saveState();
    renderStructure();
  } else if(action==='addMonth'){
    const keys = sortedMonthKeys();
    const last = keys[keys.length-1];
    const newKey = nextMonthKey(last);
    if(state.months[newKey]) return;
    const prev = state.months[last];
    state.months[newKey] = {
      incomes:{ esi1:prev.incomes.esi1, esi2:prev.incomes.esi2, ekstra:0 },
      fixedExpenses:{ ...prev.fixedExpenses },
      extras:[],
      pool: prev.pool,
      birikim: prev.birikim,
      allowance:{ ...prev.allowance },
      berkLimit: prev.berkLimit,
      balanceOverride:null
    };
    state.currentMonth = newKey;
    saveState();
    renderStructure();
  } else if(action==='deleteExtra'){
    const m = cm();
    m.extras = m.extras.filter(x=>x.id!==btn.dataset.id);
    saveState();
    buildExpensesScreen();
    renderComputed();
  } else if(action==='openAddExtra'){
    openModal('modalAddExtra');
  } else if(action==='submitAddExtra'){
    const name = document.getElementById('quickExtraName').value.trim();
    const amount = parseFloat(document.getElementById('quickExtraAmount').value) || 0;
    if(!name && amount===0) { closeModal('modalAddExtra'); return; }
    const m = cm();
    m.extras.push({ id: uid(), name: name || 'Ekstra masraf', amount });
    saveState();
    buildExpensesScreen();
    renderComputed();
    closeModal('modalAddExtra');
  } else if(action==='openSettings'){
    openModal('modalSettings');
  } else if(action==='closeModal'){
    closeModal(btn.dataset.modal);
  } else if(action==='loadSample'){
    state = structuredClone(SAMPLE_STATE);
    saveState();
    closeModal('modalSettings');
    renderStructure();
  } else if(action==='resetAll'){
    if(confirm('Tüm veriler silinecek. Emin misiniz?')){
      state = structuredClone(DEFAULT_STATE);
      saveState();
      closeModal('modalSettings');
      renderStructure();
    }
  } else if(action==='toggleAccordion'){
    const key = btn.dataset.key;
    if(openRows.has(key)) openRows.delete(key); else openRows.add(key);
    refreshHome();
  } else if(action==='resetBalanceOverride'){
    cm().balanceOverride = null;
    saveState();
    renderComputed();
  }
});

/* ---------- INIT ---------- */

document.getElementById('todayDate').textContent = new Date().toLocaleDateString('tr-TR', { day:'numeric', month:'long', year:'numeric', weekday:'long' });
renderStructure();

})();
</script>
